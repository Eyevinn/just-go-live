version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # This repo's base image reached end of life unnoticed once. This is the
  # control that stops it happening again.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
